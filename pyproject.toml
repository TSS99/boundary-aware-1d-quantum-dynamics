[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boundary-aware-dynamics"
version = "0.1.0"
description = "Boundary-aware spectral split-operator propagation for 1D quantum dynamics and its quantum-circuit representation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "qiskit>=2.0",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pylatexenc>=2.10",
]
# Only scripts/hardware_run.py needs this, and only to talk to a real device.
# Everything under results/paper is produced without it.
hardware = [
    "qiskit-ibm-runtime>=0.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
