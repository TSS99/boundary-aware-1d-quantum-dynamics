# Local hooks only. This project deliberately does not use a hosted CI service;
# `python scripts/verify_results.py --full` is the equivalent gate and runs from
# any clone with no network and no account.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2048"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      # Source notebooks are kept without stored outputs; executed copies with
      # outputs live under results/<profile>/executed_notebooks/.
      - id: nbstripout
        files: ^notebooks/.*\.ipynb$
